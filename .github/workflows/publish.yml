name: publish
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Check release metadata
        run: |
          uv lock --check
          test "${GITHUB_REF_NAME}" = "v$(uv version --short)"
      - name: Build library
        run: uv build
      - name: Publish library
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
