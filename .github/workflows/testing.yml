name: testing

on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies for Python ${{ matrix.python-version }}
      run: |
        uv sync --all-extras
    - name: Testing
      run: |
        uv run --no-sync python --version
        uv run --no-sync pytest

  lmdb-only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies without optional engines
      run: |
        uv sync
    - name: Check rocksdict is absent
      run: |
        ! uv run --no-sync python -c "import rocksdict"
    - name: Testing (LMDB only)
      run: uv run --no-sync pytest
