[project]
name = "seqbank"
version = "0.3.0"
description = "A database to quickly read and write DNA sequence data in numerical form."
authors = [{ name = "Robert Turnbull", email = "robert.turnbull@unimelb.edu.au" }]
license = "Apache-2.0"
readme = "README.rst"
requires-python = ">=3.10,<3.15"
dependencies = [
    "typer>=0.9.0",
    "numpy>=1.22.0",
    "pyfastx>=1.1.0",
    "h5py>=3.9.0",
    "biopython>=1.81",
    "attrs>=23.1.0",
    "rich>=10.16.1",
    "requests>=2.31.0",
    "joblib>=1.3.2",
    "lmdb>=1.7",
    "plotly>=6.1.1",
    "pandas>=2.0.0",
    "kaleido>=1.0.0,<2",
]

[project.optional-dependencies]
rocksdict = ["rocksdict>=0.3.29,<0.4"]
speedict = ["speedict>=0.3.11; python_version < '3.13'"]
all = ["rocksdict>=0.3.29,<0.4", "speedict>=0.3.11; python_version < '3.13'"]

[project.scripts]
seqbank = "seqbank.main:app"

[dependency-groups]
dev = [
    "pytest>=7.4.1",
    "ipykernel>=6.6.1",
    "coverage>=5.5",
    "autopep8>=1.5.7",
    "Sphinx>=5.0.0",
    "nbsphinx>=0.8.7",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autobuild>=2021.3.14",
    "pre-commit>=2.15.0",
    "sphinx-copybutton>=0.4.0",
    "black>=21.10b0",
    "sphinx-click",
]

[tool.uv.sources]
sphinx-click = { git = "https://github.com/rbturnbull/sphinx-click.git" }

[tool.black]
line-length = 120
target-version = ['py310']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
